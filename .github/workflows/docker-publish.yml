name: Build Custom API Images (ARM64)

on:
  push:
    tags: ['custom-api-*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  validate-custom-api:
    if: github.repository == 'peanutcats/waoowaoo'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DEPLOYMENT_EDITION: self-hosted
      BILLING_MODE: 'OFF'
      BILLING_TEST_BOOTSTRAP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify custom API save boundary and protocol regressions
        run: npx vitest run tests/unit/operations/user-api-config-input.test.ts tests/unit/ai-providers/custom-api.test.ts tests/unit/ai-providers/custom-api-security.test.ts
      - run: npm run typecheck
      - run: npm run lint -- src/lib/operations/domains/config/user-api-config-ops.ts tests/unit/operations/user-api-config-input.test.ts

  build-and-push:
    needs: validate-custom-api
    # Explicitly scoped to the user-owned fork; never publish the upstream superset.
    if: github.repository == 'peanutcats/waoowaoo'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/peanutcats/waoowaoo
            dockerfile: Dockerfile
            cache: app
          - image: ghcr.io/peanutcats/waoowaoo-codex-runtime
            dockerfile: Dockerfile.codex-runtime
            cache: codex-runtime
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=0.5.0-beta.1-custom-api-${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

      - name: Record immutable image for release notes
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
